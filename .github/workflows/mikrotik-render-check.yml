name: mikrotik-fleet render check

on:
  pull_request:
    paths:
      - "mikrotik-fleet/**"

jobs:
  render-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mikrotik-fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: ./render.py --check
